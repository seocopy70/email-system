# Render Blueprint — https://dashboard.render.com/blueprints 에서
# 이 레포를 선택하면 아래 설정으로 서비스가 자동으로 만들어집니다.
# (Blueprint를 안 쓰고 수동으로 만들어도 됩니다. DEPLOY.md 참고)
services:
  - type: web
    name: email-system-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: CORS_ORIGINS
        sync: false
